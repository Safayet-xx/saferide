services:
  - type: web
    name: saferide-airport-taxis
    runtime: python
    plan: free
    buildCommand: ./build.sh
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: NODE_VERSION
        value: 20.17.0
      - key: APP_ENV
        value: production
      - key: ADMIN_KEY
        generateValue: true
      - key: ENABLE_API_DOCS
        value: "false"
      # Brand details. Add BRAND_PHONE / BRAND_WHATSAPP / BRAND_ADDRESS later to show them on the site
      - key: BRAND_NAME
        value: SafeRide Airport Taxis
      - key: BRAND_LEGAL_NAME
        value: SafeRide Airport Taxis Limited
      - key: BRAND_EMAIL
        value: info@saferidetaxi.co.uk
      # Email: only SENDGRID_API_KEY needs filling in the Render dashboard
      - key: EMAIL_PROVIDER
        value: sendgrid
      - key: SENDGRID_API_KEY
        sync: false
      - key: SENDGRID_FROM_EMAIL
        value: info@saferidetaxi.co.uk
      - key: SENDGRID_FROM_NAME
        value: SafeRide Airport Taxis
      - key: BOOKINGS_EMAIL_TO
        value: info@saferidetaxi.co.uk
      - key: SEND_CUSTOMER_CONFIRMATION
        value: "true"
      - key: TIMEZONE
        value: Europe/London
